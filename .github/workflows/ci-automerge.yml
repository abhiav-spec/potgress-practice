name: Auto Merge PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

jobs:
  instant-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable Auto-Merge via REST API
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) throw new Error('No pull_request found in event payload');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;
            try {
              await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/auto-merge', {
                owner,
                repo,
                pull_number,
                merge_method: 'merge'
              });
              core.info(`Auto-merge enabled for PR #${pull_number}`);
            } catch (err) {
              core.setFailed(`Failed to enable auto-merge: ${err.message}`);
            }
